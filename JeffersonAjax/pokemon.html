<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <header><h1>Pokedex</h1></header>

    <div class="coluna-central">

        <div class="conteudo">

            <form action="">

                <input type="text" name="Nome" placeholder="Insira nome">

                <button type="submit">Enviar</button>

            </form>

            <section class="resultado">

                <h2 id="pokemon-nome">Nome</h2>
                <p id="pokemon-num">numero</p>

                <div id="pokemon-foto">

                    <img src="" alt="">

                </div>

                <div id="pokemon-tipo"></div>

                <div id="pokemon-atributos">

                    <span>Altura</span>
                    <strong id="altura">0,4 m</strong>

                    <span>Peso</span>
                    <strong id="peso">6,0 Kg</strong>

                    <progress value="" max=""></progress>

                </div>

                

            </section>

            <script src="script.js"></script>

        </div>

    </div>

</body>
</html>
