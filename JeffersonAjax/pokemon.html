<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>

    <header><img src="Pokebola-pokeball-png-0.webp" alt=""><h1>Pokedex</h1></header>

    <div class="coluna-central">

        <div class="conteudo">

            <form action="">

                <div class="pesquisar">

                    <input type="text" name="Nome" placeholder="Insira nome">

                    <button type="submit"><i class="bi bi-search"></i></button>


                </div>

                
            </form>

            <section class="resultado">

                <h2 id="pokemon-nome"></h2>
                <p id="pokemon-num"></p>

                <div id="pokemon-foto">

                    <img src="" alt="">

                </div>

                <section id="status" class="invisivel">

                    <strong id="Altura"></strong>

                    <strong id="Peso"></strong>

                    <div id="pokemon-tipo"></div>

                    <div id="pokemon-atributos"></div>

                </section>

            </section>

            <script src="script.js"></script>

        </div>

    </div>

</body>
</html>
